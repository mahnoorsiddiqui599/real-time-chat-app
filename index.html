    <body>
  <div class="container" id="auth-container">
      <div class="logo">
          <i class="fas fa-comments"></i>
      </div>
      <h1>Chat App <span class="heart">❤</span></h1>
      
      <div class="input-group">
          <input type="email" name="email" id="email" placeholder="Enter your Email">
          <i class="fas fa-envelope input-icon"></i>
      </div>
      
      <div class="input-group">
          <input type="password" name="password" id="password" placeholder="Enter your Password">
          <i class="fas fa-lock input-icon"></i>
      </div>
      
      <button id="signup"><i class="fas fa-user-plus"></i> SignUp</button>
      <button id="login"><i class="fas fa-sign-in-alt"></i> LogIn</button>
      
      <div class="divider">
          <span>or continue with</span>
      </div>
      
      <button id="google-btn"><i class="fab fa-google"></i> Continue with Google</button>
      <p>Use any email (password ≥ 6 characters). After signup/login you'll choose a username.</p>
  </div>
  
  <!-- Flower elements for animation -->
  <div class="flowers">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
  </div>
  <script type="module" src="app.js"></script>
</body>

</body>
